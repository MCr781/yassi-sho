<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Aparat">
  <!-- Aparat logo (vector recreation).
       Structure (from official icon analysis):
       - Magenta (#ED145B) circle, center (64,64), radius 44
       - 5 white "film-reel sprocket" holes inside (center + N/S/E/W)
       - 4 black curved "petal" shapes outside the circle at NW/NE/SW/SE,
         each hugging the circle's edge.

       All 4 petals are identical and rotated 90° from each other.
       A single petal sits in the NW corner, spanning roughly
       x[26-54] y[12-30] (in 128px space) and curves along the circle. -->
  <defs>
    <clipPath id="ap-circ">
      <circle cx="64" cy="64" r="44"/>
    </clipPath>
  </defs>

  <!-- 4 black petals (curved triangular shapes hugging the circle, one per corner) -->
  <g fill="#000">
    <!-- NW petal -->
    <path d="M38 16 C 30 16 24 24 26 32 C 30 44 40 50 52 50 C 48 38 44 28 38 16 Z"/>
    <!-- NE petal (mirror of NW across vertical center) -->
    <path d="M90 16 C 98 16 104 24 102 32 C 98 44 88 50 76 50 C 80 38 84 28 90 16 Z"/>
    <!-- SW petal (mirror of NW across horizontal center) -->
    <path d="M38 112 C 30 112 24 104 26 96 C 30 84 40 78 52 78 C 48 90 44 100 38 112 Z"/>
    <!-- SE petal (mirror of NE across horizontal center) -->
    <path d="M90 112 C 98 112 104 104 102 96 C 98 84 88 78 76 78 C 80 90 84 100 90 112 Z"/>
  </g>

  <!-- Magenta circle body -->
  <circle cx="64" cy="64" r="44" fill="#ED145B"/>

  <!-- 5 white sprocket holes (film-reel pattern) -->
  <g clip-path="url(#ap-circ)" fill="#fff">
    <circle cx="64" cy="64" r="8"/>
    <circle cx="64" cy="40" r="7"/>
    <circle cx="64" cy="88" r="7"/>
    <circle cx="40" cy="64" r="7"/>
    <circle cx="88" cy="64" r="7"/>
  </g>
</svg>
