<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحه عضویت | یاسی شو</title>

    <link rel="stylesheet" href="assets/css/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="assets/css/all.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-white text-slate-800 selection:bg-brand-pink selection:text-white font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="sticky top-0 bg-white/90 backdrop-blur-lg border-b border-slate-200 shadow-sm z-50 transition-all">
        <div class="relative max-w-[1400px] mx-auto px-3 sm:px-4 h-16 md:h-20 flex justify-between items-center gap-3">

            <!-- Mobile: Hamburger Button (right side / start in RTL) -->
            <button onclick="document.getElementById('mobile-menu').classList.remove('hidden'); document.body.classList.add('overflow-hidden');" class="md:hidden shrink-0 w-10 h-10 flex items-center justify-center bg-slate-100 text-slate-700 rounded-full hover:bg-slate-200 active:bg-slate-300 transition-colors" aria-label="منو">
                <i class="fa-solid fa-bars text-base"></i>
            </button>

            <!-- Right side (Nav Links) - Desktop only -->
            <nav class="hidden md:flex gap-6 lg:gap-8 text-[14px] font-bold text-slate-600">
                <a href="index.html" class="text-brand-purple-dark transition-all duration-300">خانه</a>
                <a href="about.html" class="hover:text-brand-purple-dark hover:-translate-y-0.5 transition-all duration-300">درباره ما</a>
                <a href="contact.html" class="hover:text-brand-purple-dark hover:-translate-y-0.5 transition-all duration-300">تماس با ما</a>
                <a href="https://yaas.org.ir" target="_blank" class="hover:text-brand-purple-dark hover:-translate-y-0.5 transition-all duration-300">انجمن یاس</a>
            </nav>

            <!-- Center Logo (flex on mobile, absolute on desktop) -->
            <a href="index.html" class="flex-1 md:flex-none md:absolute md:left-1/2 md:-translate-x-1/2 flex items-center justify-center cursor-pointer group">
                <img src="assets/images/site-logo-banner.png" alt="YasiShow Logo"
                    class="h-10 md:h-14 object-contain group-hover:opacity-90 transition-opacity duration-300">
            </a>

            <!-- Left side (Lang & Socials) -->
            <div class="flex items-center gap-2 md:gap-6 text-slate-500 text-[13px] font-bold shrink-0">
                <div class="cursor-pointer hover:text-brand-purple-dark transition-colors bg-slate-100 px-2.5 py-1.5 md:px-3 rounded-full text-[11px] md:text-[13px]">
                    فارسی | EN</div>
                <div class="hidden sm:flex gap-3 text-lg">
                    <i class="fa-brands fa-instagram text-pink-600 hover:-translate-y-1 hover:scale-110 transition-all cursor-pointer"></i>
                    <i class="fa-brands fa-telegram text-blue-500 hover:-translate-y-1 hover:scale-110 transition-all cursor-pointer"></i>
                    <i class="fa-brands fa-whatsapp text-green-500 hover:-translate-y-1 hover:scale-110 transition-all cursor-pointer"></i>
                    <i class="fa-brands fa-youtube text-red-600 hover:-translate-y-1 hover:scale-110 transition-all cursor-pointer"></i>
                </div>
            </div>

        </div>
    </header>

    <!-- Mobile Menu Drawer -->
    <div id="mobile-menu" class="fixed inset-0 z-[60] hidden md:hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="document.getElementById('mobile-menu').classList.add('hidden'); document.body.classList.remove('overflow-hidden');"></div>
        <div class="absolute top-0 right-0 h-full w-72 max-w-[85vw] bg-white shadow-2xl flex flex-col overflow-y-auto">
            <div class="h-16 px-4 flex items-center justify-between border-b border-slate-200 bg-gradient-to-l from-brand-purple-light to-brand-purple-dark text-white">
                <span class="font-black text-[15px]">منوی یاسی شو</span>
                <button onclick="document.getElementById('mobile-menu').classList.add('hidden'); document.body.classList.remove('overflow-hidden');" class="w-9 h-9 flex items-center justify-center bg-white/20 hover:bg-white/30 rounded-full transition-colors" aria-label="بستن">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <nav class="flex flex-col p-4 gap-1">
                <a href="index.html" class="flex items-center gap-3 px-4 py-3.5 rounded-xl text-slate-700 font-bold hover:bg-slate-100 hover:text-brand-purple-dark active:bg-slate-200 transition-colors">
                    <i class="fa-solid fa-home w-5 text-center text-brand-purple-light"></i> خانه
                </a>
                <a href="about.html" class="flex items-center gap-3 px-4 py-3.5 rounded-xl text-slate-700 font-bold hover:bg-slate-100 hover:text-brand-purple-dark active:bg-slate-200 transition-colors">
                    <i class="fa-solid fa-circle-info w-5 text-center text-brand-purple-light"></i> درباره ما
                </a>
                <a href="contact.html" class="flex items-center gap-3 px-4 py-3.5 rounded-xl text-slate-700 font-bold hover:bg-slate-100 hover:text-brand-purple-dark active:bg-slate-200 transition-colors">
                    <i class="fa-solid fa-envelope w-5 text-center text-brand-purple-light"></i> تماس با ما
                </a>
                <a href="https://yaas.org.ir" target="_blank" class="flex items-center gap-3 px-4 py-3.5 rounded-xl text-slate-700 font-bold hover:bg-slate-100 hover:text-brand-purple-dark active:bg-slate-200 transition-colors">
                    <i class="fa-solid fa-external-link w-5 text-center text-brand-purple-light"></i> انجمن یاس
                </a>
            </nav>
            <div class="px-4 pt-2 pb-6 mt-2 border-t border-slate-100">
                <p class="text-[11px] font-bold text-slate-400 mb-3">ما را در شبکه‌های اجتماعی دنبال کنید</p>
                <div class="flex gap-2">
                    <a href="#" class="flex-1 h-11 flex items-center justify-center bg-pink-50 text-pink-600 rounded-xl hover:bg-pink-100 transition-colors">
                        <i class="fa-brands fa-instagram text-lg"></i>
                    </a>
                    <a href="#" class="flex-1 h-11 flex items-center justify-center bg-blue-50 text-blue-500 rounded-xl hover:bg-blue-100 transition-colors">
                        <i class="fa-brands fa-telegram text-lg"></i>
                    </a>
                    <a href="#" class="flex-1 h-11 flex items-center justify-center bg-green-50 text-green-500 rounded-xl hover:bg-green-100 transition-colors">
                        <i class="fa-brands fa-whatsapp text-lg"></i>
                    </a>
                    <a href="#" class="flex-1 h-11 flex items-center justify-center bg-red-50 text-red-600 rounded-xl hover:bg-red-100 transition-colors">
                        <i class="fa-brands fa-youtube text-lg"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Form Area -->
    <main class="flex-1 w-full max-w-[950px] mx-auto px-4 mt-16 md:mt-20 mb-12 md:mb-16 flex flex-col items-center relative z-10">
        
        <!-- Premium Card Container -->
        <div class="bg-white w-full rounded-[2.5rem] shadow-2xl shadow-slate-200/50 p-8 md:p-14 border border-slate-100 relative overflow-hidden">
            
            <!-- Subtle background glows -->
            <div class="absolute -top-20 -end-20 w-40 h-40 bg-brand-pink/5 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-20 -start-20 w-40 h-40 bg-[#20b2aa]/5 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Sleek Modern Badge/Title -->
            <div class="relative z-10 flex justify-center mb-10">
                <div class="bg-slate-50 border border-slate-100 text-brand-purple-dark px-6 py-2 rounded-full font-black text-lg shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-brand-pink"></i> عضویت در یاسی شو
                </div>
            </div>

            <div class="w-full flex flex-col md:flex-row gap-12 md:gap-20 items-center justify-center relative z-10">
                
                <!-- Right Column: Form Inputs (RTL: Label first, then Input) -->
                <div class="flex-1 flex flex-col gap-5 w-full max-w-[450px] order-2 md:order-1">
                    <!-- Row 1 -->
                    <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
                        <label class="w-full md:w-32 text-start md:text-end mb-1 md:mb-0 font-bold text-slate-700 text-sm md:text-[15px] shrink-0">نام و نام خانوادگی</label>
                        <input type="text" class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl h-12 px-4 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-purple-light/40 focus:border-brand-purple-light shadow-inner transition-all text-sm text-slate-800 font-medium font-sans">
                    </div>
                    <!-- Row 2 -->
                    <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
                        <label class="w-full md:w-32 text-start md:text-end mb-1 md:mb-0 font-bold text-slate-700 text-sm md:text-[15px] shrink-0">شماره همراه</label>
                        <input type="tel" class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl h-12 px-4 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-purple-light/40 focus:border-brand-purple-light shadow-inner transition-all text-sm text-slate-800 font-medium text-end tracking-wider font-sans" dir="ltr">
                    </div>
                    <!-- Row 3 -->
                    <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
                        <label class="w-full md:w-32 text-start md:text-end mb-1 md:mb-0 font-bold text-slate-700 text-sm md:text-[15px] shrink-0">شغل</label>
                        <input type="text" class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl h-12 px-4 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-purple-light/40 focus:border-brand-purple-light shadow-inner transition-all text-sm text-slate-800 font-medium font-sans">
                    </div>
                    <!-- Row 4 -->
                    <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
                        <label class="w-full md:w-32 text-start md:text-end mb-1 md:mb-0 font-bold text-slate-700 text-sm md:text-[15px] shrink-0">میزان تحصیلات</label>
                        <input type="text" class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl h-12 px-4 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-purple-light/40 focus:border-brand-purple-light shadow-inner transition-all text-sm text-slate-800 font-medium font-sans">
                    </div>
                    <!-- Row 5 -->
                    <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
                        <label class="w-full md:w-32 text-start md:text-end mb-1 md:mb-0 font-bold text-slate-700 text-sm md:text-[15px] shrink-0">استان</label>
                        <input type="text" class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl h-12 px-4 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-purple-light/40 focus:border-brand-purple-light shadow-inner transition-all text-sm text-slate-800 font-medium font-sans">
                    </div>
                    <!-- Row 6 -->
                    <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
                        <label class="w-full md:w-32 text-start md:text-end mb-1 md:mb-0 font-bold text-slate-700 text-sm md:text-[15px] shrink-0">شهر</label>
                        <input type="text" class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl h-12 px-4 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-purple-light/40 focus:border-brand-purple-light shadow-inner transition-all text-sm text-slate-800 font-medium font-sans">
                    </div>
                </div>

                <!-- Left Column: Upload Photo Dropzone -->
                <div class="w-full md:w-[280px] flex-shrink-0 order-1 md:order-2 flex justify-center">
                    <div class="w-[260px] h-[260px] bg-slate-50/50 border-2 border-dashed border-slate-300 rounded-[2.5rem] flex flex-col items-center justify-center cursor-pointer hover:border-[#20b2aa] hover:bg-[#20b2aa]/5 transition-all duration-300 group relative shadow-sm hover:shadow-md">
                        <div class="w-16 h-16 bg-white rounded-full shadow-sm flex items-center justify-center mb-4 group-hover:scale-110 group-hover:shadow-md transition-all duration-300">
                            <i class="fa-solid fa-cloud-arrow-up text-2xl text-slate-400 group-hover:text-[#20b2aa] transition-colors"></i>
                        </div>
                        <span class="font-sans font-black text-lg text-slate-600 group-hover:text-[#20b2aa] transition-colors">بارگذاری عکس</span>
                        <span class="font-sans text-xs text-slate-400 mt-2 font-medium">برای انتخاب کلیک کنید</span>
                        <input type="file" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" accept="image/*">
                    </div>
                </div>
                
            </div>

            <!-- Submit Button -->
            <div class="mt-14 w-full flex justify-center relative z-10">
                <button onclick="window.location.href='profile.html'" class="font-sans bg-gradient-to-r from-[#20b2aa] to-[#128a87] text-white font-black text-[18px] py-4 px-24 rounded-[1.25rem] shadow-lg shadow-[#20b2aa]/30 hover:shadow-[#20b2aa]/50 transition-all duration-300 hover:-translate-y-1 min-w-[280px] flex items-center justify-center gap-3">
                    ثبت نام <i class="fa-solid fa-arrow-left"></i>
                </button>
            </div>
            
        </div>

    </main>

</body>

</html>
